# Foresight · Диспетчер — nginx внутри образа dashboard.
# Это шаблон: при старте контейнера entrypoint образа nginx подставляет ${FORESIGHT_*} и ${NGINX_LOCAL_RESOLVERS}
# (только эти переменные, см. NGINX_ENVSUBST_FILTER в Dockerfile) и кладёт результат в /etc/nginx/conf.d/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;  # an unprivileged port, the same inside and outside (DASHBOARD_PORT)
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    # Имена api и grafana резолвятся при запросе (DNS Docker из /etc/resolv.conf): дашборд стартует и отдаёт
    # статику, даже если backend или Grafana ещё не запущены (запрос к ним вернёт 502, фронт покажет деградацию).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    resolver_timeout 3s;
    set $api_upstream http://${FORESIGHT_API_UPSTREAM};
    set $grafana_upstream http://${FORESIGHT_GRAFANA_UPSTREAM};

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    # Внешним сайтам уходит только origin (без пути и параметров): тайл-серверу OpenStreetMap Referer обязателен —
    # без него он вместо тайлов отдаёт картинку «Access blocked» (правила использования tile.openstreetmap.org)
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Управление (пороги, модели, демо-поток): просмотр открыт, изменения — под паролем, если задан
    # FORESIGHT_ADMIN_PASSWORD (публичный стенд; файл пишет docker/40-foresight-config.sh, без пароля он пустой)
    location ~ ^/api/(admin|replay)/ {
        include /etc/nginx/foresight/admin-auth.conf;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # REST API и здоровье backend (запрос передаётся как есть: /api/... → api:8000/api/...)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger API через ту же точку входа (публичный стенд: наружу открыт только дашборд)
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # WebSocket потока ТС, инцидентов и часов
    location = /ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Grafana на sub-path /grafana/ (GF_SERVER_SERVE_FROM_SUB_PATH=true: путь передаётся без изменений)
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # Ассеты Vite с хэшем в имени — кэш навсегда
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Runtime-конфиг пишется при старте контейнера — не кэшировать
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA: любые пути приложения → index.html (без кэша, чтобы новая сборка подхватывалась сразу)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
